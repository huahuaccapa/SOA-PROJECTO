services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
    - 5672:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
    - byteverse-network
    healthcheck:
      test:
      - CMD
      - rabbitmqctl
      - status
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
    - 6379:6379
    networks:
    - byteverse-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    environment: []
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
    - 3000:3000
    environment:
    - NODE_ENV=production
    - JWT_SECRET=${JWT_SECRET:-secret}
    - REFRESH_SECRET=${REFRESH_SECRET:-refresh_secret}
    - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
    - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
    - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    - CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-byteverse}
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
    - api_gateway_uploads:/app/uploads
    networks:
    - byteverse-network
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
    - 3001:3001
    environment:
    - NODE_ENV=production
    - JWT_SECRET=${JWT_SECRET:-secret}
    - REFRESH_SECRET=${REFRESH_SECRET:-refresh_secret}
    - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
    - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN:-7d}
    - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
    - MYSQL_PORT=3306
    - MYSQL_USER=${MYSQL_USER:-root}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-250520}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-byteverse_db}
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-765528287121-88mllq5oksjrkfbins18bi90lq4j22ku.apps.googleusercontent.com}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
    - OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET}
    - COOKIE_SECURE=${COOKIE_SECURE:-false}
    - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_SECURE=${SMTP_SECURE:-false}
    - SMTP_USER=${SMTP_USER:-}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - MAIL_FROM=${MAIL_FROM:-ByteVerse <no-reply@byteverse.com>}
    - RESET_TOKEN_MINUTES=${RESET_TOKEN_MINUTES:-30}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
    - byteverse-network
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    extra_hosts:
    - host.docker.internal:host-gateway
  users-service:
    build: ./services/users-service
    container_name: users-service
    restart: unless-stopped
    ports:
    - 3004:3004
    environment:
    - NODE_ENV=production
    - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
    - MYSQL_PORT=3306
    - MYSQL_USER=${MYSQL_USER:-root}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-250520}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-byteverse_db}
    - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
    - byteverse-network
    extra_hosts:
    - host.docker.internal:host-gateway
  products-service:
